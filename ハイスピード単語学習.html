<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ハイスピード単語学習｜毎日ひらくだけ</title>
<style>
:root{--bg:#fff6ec;--card:#fff;--tx:#2a2118;--mu:#8a7b6b;--ac:#ff6b2c;--ac2:#ffb12c;--ln:#f0e3d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120c;--card:#241d14;--tx:#f5ece0;--mu:#a89884;--ln:#3a2f22}}
:root[data-theme="dark"]{--bg:#17120c;--card:#241d14;--tx:#f5ece0;--mu:#a89884;--ln:#3a2f22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:14px;max-width:520px;margin-inline:auto}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:13px;margin:0 0 8px;color:var(--mu);font-weight:600}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}
.pill{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:2px 12px;font-size:14px}
.hero{text-align:center;padding:20px 16px}
.go{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:20px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.go:active{transform:translateY(3px);box-shadow:none}
button{font:inherit}.g{padding:9px 13px;border:1px solid var(--ln);border-radius:10px;background:transparent;color:var(--mu);font-size:13px}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.mu{color:var(--mu);font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{border:1px solid var(--ln);border-radius:8px;padding:5px 0;text-align:center;font-size:11px}.cell b{display:block;font-size:13px}
.chart{display:flex;align-items:flex-end;gap:3px;height:70px}.chart div{flex:1;background:var(--ac);border-radius:3px 3px 0 0}
input{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
input{min-width:0;max-width:100%}input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;text-align:left}.g2>div{min-width:0}
label{font-size:12px;color:var(--mu);display:block}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{border:2px solid var(--ac);text-align:center}
.xbtn{display:block;text-align:center;padding:12px;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-weight:700;margin-top:10px}
.tm{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.dot{width:90px;height:90px;border-radius:50%;background:var(--ac);margin:12px auto;opacity:.25;transition:opacity .08s,transform .08s}
.dot.on{opacity:1;transform:scale(1.15)}
.seiz{width:100%;padding:26px;font-size:30px;font-weight:800;border:3px solid var(--ac);border-radius:18px;background:var(--card);color:var(--ac)}
.seiz:active{background:var(--ac);color:#fff}
.cf{position:fixed;top:-30px;font-size:24px;animation:fall 2.4s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style></head><body>
<div id="app"></div>
<script>
const K='hs-vocab-v1',APP='https://claude.ai/artifact/QMeEWpa55ygnbb9eEd7ayG';
let S={book:'',ch:10,wp:50,laps:10,dl:'',logs:[],set:false};
try{const r=localStorage.getItem(K);if(r)Object.assign(S,JSON.parse(r))}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const $=i=>document.getElementById(i);
const done=c=>S.logs.filter(l=>l.c===c).length;
const autoCh=()=>{for(let c=1;c<=S.ch;c++)if(done(c)<S.laps)return c;return S.ch};
const fmt=t=>{t=Math.floor(t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
let sess=null,edit=!S.set||!S.book,sel=null,res=null,bpm=60,tmIv=null;

/* ---- storage / sync ---- */
let DB=null,UID=null,sync='この端末のブラウザに保存中（CSV保存でバックアップできます）';
const col=()=>DB.collection("data/users/"+UID);
function save(days){
  try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
  if(!DB)return;
  (async()=>{try{
    await col().doc("settings").set({book:S.book,ch:S.ch,wp:S.wp,laps:S.laps,dl:S.dl,set:S.set});
    for(const d of [...new Set(days||[])]){const logs=S.logs.filter(l=>l.d===d);
      if(logs.length)await col().doc("d_"+d).set({logs});else await col().doc("d_"+d).delete()}
    sync='✅ アカウントに自動保存中';
  }catch(e){sync='⚠️ 同期失敗（この端末には保存済み）'}
  const el=$('sy');if(el)el.textContent=sync})();
}
async function boot(){
  try{
    const user=await claude.use("user"),db=await claude.use("db");
    if(user&&db){UID=await user.id();if(UID){DB=db;
      const snap=await col().get();let logs=[],cfg=null;
      snap.docs.forEach(d=>{const v=d.data()||{};if(d.id==="settings")cfg=v;else if(d.id.startsWith("d_"))logs=logs.concat(v.logs||[]);else if(d.id==="session"&&!sess&&v.c)sess={c:v.c,acc:v.acc||0,m:v.m||0,run:false,seg:0}});
      if(cfg||logs.length){Object.assign(S,cfg||{});S.logs=logs.sort((a,b)=>(a.ts||0)-(b.ts||0)||(a.d<b.d?-1:1));edit=!S.set||!S.book;
        try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}sync='✅ アカウントに自動保存中'}
      else if(S.set||S.logs.length)save(S.logs.map(l=>l.d));
      else sync='✅ アカウントに自動保存中'}}
  }catch(e){}
  render();
}
async function exportCsv(){
  const rows=['日付,章,時間(分),正の数,秒/語'].concat(S.logs.map(l=>[l.d,l.c,l.min.toFixed(2),l.m,l.s.toFixed(2)].join(',')));
  try{const dl=await claude.use("downloads");if(dl)await dl.save({filename:"vocab-log.csv",data:"\ufeff"+rows.join("\n")})}catch(e){}
}

/* ---- metronome: 3 methods, auto-fallback + manual switch ---- */
let aud=null,unl=null,fIv=null,wIv=null,ac=null,mMeth=0,mTok=0,mOn=false;
function wavBytes(b,click){
  const sr=22050,n=Math.round(sr*60/b),cl=Math.round(sr*.05),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  if(click)for(let i=0;i<Math.min(cl,n);i++)v.setInt16(44+i*2,Math.sin(2*Math.PI*1000*i/sr)*(1-i/cl)*30000,true);
  return new Uint8Array(buf)}
function dataURI(u){let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return 'data:audio/wav;base64,'+btoa(s)}
function setSnd(t){const e=$('snd');if(e)e.textContent='音：'+t}
function flash(){const d=$('dot');if(d){d.classList.add('on');setTimeout(()=>d.classList.remove('on'),110)}}
function tick(){try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='square';o.frequency.value=1000;
  g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.08)}catch(e){}}
function mStop(){mTok++;mOn=false;clearInterval(fIv);clearInterval(wIv);[aud,unl].forEach(a=>{if(a){try{a.pause()}catch(e){}}});aud=null;unl=null}
function mStart(){
  mStop();mOn=true;const tok=mTok;flash();fIv=setInterval(flash,60000/bpm);
  const nxt=why=>{if(tok!==mTok||mMeth>=2)return;mMeth++;const m=mMeth;mStart();setSnd('方式'+(m+1)+'に自動切替（'+why+'）')};
  if(mMeth<2){
    try{
      const u=wavBytes(bpm,true),a=new Audio();aud=a;
      a.src=mMeth===0?dataURI(u):URL.createObjectURL(new Blob([u],{type:'audio/wav'}));
      a.loop=true;a.volume=1;a.setAttribute('playsinline','');
      a.onerror=()=>nxt('エラー');a.onplaying=()=>{if(tok===mTok)setSnd('方式'+(mMeth+1)+' 再生中')};
      const p=a.play();if(p&&p.catch)p.catch(()=>nxt('再生が拒否'));
      setSnd('方式'+(mMeth+1)+' 開始中…');
      setTimeout(()=>{if(tok===mTok&&aud===a&&(a.paused||a.currentTime===0))nxt('再生されず')},1500);
    }catch(e){nxt('例外')}
  }else{
    try{unl=new Audio(dataURI(wavBytes(60,false)));unl.loop=true;unl.play().catch(()=>{})}catch(e){}
    try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
    tick();wIv=setInterval(tick,60000/bpm);setSnd('方式3 再生中')}
}
function mNext(){mMeth=(mMeth+1)%3;mStart()}
function setBpm(d){bpm=Math.min(200,Math.max(30,bpm+d));const e=$('bp');if(e)e.textContent=bpm;if(mOn)mStart()}

/* ---- logic ---- */
function streak(){const ds=new Set(S.logs.map(l=>l.d));let n=0,d=new Date();if(!ds.has(ymd(d)))d.setDate(d.getDate()-1);while(ds.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
const RANKS=[[0,'🥚 見習い'],[10,'🏃 ランナー'],[30,'⚡ スピードスター'],[70,'🧠 暗記マスター'],[150,'👹 単語の鬼'],[300,'👑 レジェンド']];
const rank=n=>RANKS.filter(r=>n>=r[0]).pop()[1];
function confetti(){for(let i=0;i<30;i++){const e=document.createElement('span');e.textContent=['🎉','✨','🔥','⭐'][i%4];e.className='cf';e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}}
try{const r=localStorage.getItem(K+'-sess');if(r){const o=JSON.parse(r);if(o&&o.c)sess={c:o.c,acc:o.acc||0,m:o.m||0,run:false,seg:0}}}catch(e){}
addEventListener('pagehide',()=>pSess(true));document.addEventListener('visibilitychange',()=>{if(document.hidden)pSess(true)});
const SK=K+'-sess';
const elapsed=()=>sess.acc+(sess.run?(Date.now()-sess.seg)/1000:0);
function pSess(db){if(!sess)return;const o={c:sess.c,acc:elapsed(),m:sess.m};
  try{localStorage.setItem(SK,JSON.stringify(o))}catch(e){}
  if(db&&DB)(async()=>{try{await col().doc("session").set(o)}catch(e){}})()}
function clrSess(){try{localStorage.removeItem(SK)}catch(e){}
  if(DB)(async()=>{try{await col().doc("session").delete()}catch(e){}})()}
function runTick(){clearInterval(tmIv);let n=0;tmIv=setInterval(()=>{const e=$('tm');if(e&&sess)e.textContent=fmt(elapsed());n++;pSess(n%10===0)},1000)}
function start(){sess={c:sel||autoCh(),acc:0,seg:Date.now(),run:true,m:0};res=null;pSess(true);render();mStart();runTick()}
function pause(){sess.acc=elapsed();sess.run=false;mStop();clearInterval(tmIv);pSess(true);render()}
function resume(){sess.seg=Date.now();sess.run=true;render();mStart();runTick()}
function plus(){sess.m++;$('mc').textContent=sess.m;pSess(false)}
function cancel(){mStop();clearInterval(tmIv);clrSess();sess=null;render()}
function finish(){
  mStop();clearInterval(tmIv);
  const min=Math.max(.05,elapsed()/60),s=min*60/S.wp,d=ymd(new Date());
  const prev=S.logs.length?Math.min(...S.logs.map(l=>l.s)):null;
  S.logs.push({c:sess.c,m:sess.m,min,s,d,ts:Date.now()});
  res={c:sess.c,min,s,m:sess.m,best:prev===null||s<prev,first:prev===null};
  clrSess();sess=null;sel=null;save([d]);render();confetti()}
function resetAll(){const b=$('rs');if(!b.dataset.a){b.dataset.a=1;b.textContent='本当に消す？もう一度タップ';return}
  const ds=[...new Set(S.logs.map(l=>l.d))];S.logs=[];S.book='';S.set=false;res=null;edit=true;save(ds);render()}
function undo(){const l=S.logs.pop();res=null;save(l?[l.d]:[]);render()}
function saveSet(){
  S.book=$('b').value;S.ch=Math.max(1,+$('ch').value||1);S.wp=Math.max(1,+$('wp').value||1);S.laps=Math.max(1,+$('lp').value||1);S.dl=$('dl').value;S.set=true;edit=false;sel=null;save([]);render()}

/* ---- views ---- */
function render(){
  const A=$('app');
  if(edit){
    const d30=new Date();d30.setDate(d30.getDate()+30);
    A.innerHTML=`<div class="c"><h2>📖 ハイスピード単語学習</h2><p style="margin:0">やることは3つだけ。<br>① 単語帳を章に分けて、1章ずつ高速で何周も回す<br>② 1秒で意味が出ない単語に「正」を付ける<br>③ 毎日このアプリを開いて「スタート」を押す</p>
    <p class="mu" style="margin:8px 0 0">出典：<a href="https://note.com/personalitytea/n/neb4ff92c4a8d" target="_blank" rel="noopener" style="color:var(--ac)">『0からのハイスピード単語学習法』（ゴリラTeacher）</a></p></div>
    <div class="c"><h2>最初の設定（あとで変更できます）</h2>
    <label>単語帳の名前</label><input id="b" value="${esc(S.book)}" placeholder="例：システム英単語"><br><br>
    <div class="g2"><div><label>章の数</label><input id="ch" type="number" inputmode="numeric" value="${S.ch}"></div>
    <div><label>1章の単語数</label><input id="wp" type="number" inputmode="numeric" value="${S.wp}"></div>
    <div><label>1章あたりの周回数</label><input id="lp" type="number" inputmode="numeric" value="${S.laps}"></div>
    <div><label>終わらせたい日</label><input id="dl" type="date" value="${S.dl||ymd(d30)}"></div></div><br>
    <button class="go" onclick="saveSet()">この設定で始める</button>
    ${S.set&&S.book?`<br><br><div class="row" style="justify-content:space-between"><button class="g" onclick="edit=false;render()">← 戻る</button><button class="g" id="rs" onclick="resetAll()">記録を全部消して最初から</button></div>`:''}</div>`;return}
  if(sess){
    A.innerHTML=`<div class="c"><h2>${sess.c}章 ${done(sess.c)+1}周目</h2><div class="tm" id="tm">${fmt(elapsed())}</div>
    <div class="dot" id="dot"></div>
    <div class="row" style="justify-content:center"><button class="g" onclick="setBpm(-5)">−</button><b><span id="bp">${bpm}</span> BPM</b><button class="g" onclick="setBpm(5)">＋</button></div>
    <p class="mu" style="text-align:center">1拍＝1語。英語を見て声に出し、1秒で意味が出なければ下の「正」を押す。</p>
    <p class="mu" style="text-align:center" id="snd">音：—</p>
    <div style="text-align:center"><button class="g" onclick="mNext()">🔊 音が聞こえない時：別の方式で鳴らす</button></div></div>
    <button class="g" style="width:100%;margin-bottom:12px;padding:12px" onclick="${sess.run?'pause()':'resume()'}">${sess.run?'⏸ 一時停止（閉じる前に押すと安全）':'▶ 再開（前回の続きです）'}</button>
    <button class="seiz" onclick="plus()">正 を付けた <span id="mc">${sess.m}</span> 語</button><br><br>
    <button class="go" onclick="finish()">✓ この周回を完了</button><br><br>
    <div style="text-align:center"><button class="g" onclick="cancel()">やめる（記録しない）</button></div>`;return}
  const ch=sel||autoCh(),total=S.ch*S.laps,dn=S.logs.length,pct=Math.round(dn/total*100),t=ymd(new Date());
  const dt=S.logs.filter(l=>l.d===t).length;
  const days=S.dl?Math.max(1,Math.ceil((new Date(S.dl+'T23:59:59')-new Date())/864e5)):30;
  const quota=Math.max(1,Math.ceil((total-dn+dt)/days)),left=Math.max(0,quota-dt),st=streak();
  const last=S.logs.slice(-20),mx=Math.max(1,...last.map(l=>l.s)),best=S.logs.length?Math.min(...S.logs.map(l=>l.s)):0;
  const avg=last.length?last.reduce((x,l)=>x+l.min,0)/last.length:0;
  const weak=Object.entries(S.logs.reduce((o,l)=>(o[l.c]=l.m,o),{})).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const C=2*Math.PI*44,off=C*(1-Math.min(1,dt/quota));
  let msg=left>0?`あと${left}周で今日はクリア${avg?`（1周 約${Math.max(1,Math.round(avg))}分）`:''}`:'今日のノルマ達成！あとは単語帳で進めるだけ。明日もここを開こう';
  if(dt>0&&[3,7,14,30,100].includes(st))msg='🎉 '+st+'日連続！この調子！';
  const tw=`📖 ハイスピード単語学習 ${st}日連続🔥\n今日${dt}周／全体${pct}%${best?`\n最速 ${best.toFixed(1)}秒/語`:''}\n#ハイスピード単語学習`;
  const xh='https://twitter.com/intent/tweet?text='+encodeURIComponent(tw)+'&url='+encodeURIComponent(APP);
  let cells='';for(let c=1;c<=S.ch;c++){const p=Math.min(1,done(c)/S.laps);cells+=`<div class="cell" onclick="sel=${c};render()" style="background:rgba(255,107,44,${(p*.4).toFixed(2)});${c===ch?'outline:2px solid var(--ac)':''}">${c}章<b>${done(c)}/${S.laps}</b></div>`}
  A.innerHTML=`<div class="top"><span class="pill">🔥 ${st}日連続</span><span class="pill">${rank(dn)}</span></div>
  <div class="c row" style="padding:10px 14px"><b>📚 ${esc(S.book||'単語帳が未設定です')}</b><button class="g" style="margin-left:auto" onclick="edit=true;render()">✏️ 単語帳を設定・変更</button></div>
  ${res?`<div class="c res"><div style="font-size:34px">${res.best&&!res.first?'🏆':'🎉'}</div><b style="font-size:18px">${res.best&&!res.first?'自己ベスト更新！':'周回完了！'}</b>
  <p style="margin:6px 0">${res.c}章｜${fmt(res.min*60)}｜1語 ${res.s.toFixed(1)}秒｜正 ${res.m}語</p>
  <a class="xbtn" href="${xh}" target="_blank" rel="noopener">𝕏 で今日の記録をシェア</a></div>`:''}
  <div class="c hero"><div class="mu">今日のミッション</div>
  <svg width="120" height="120" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--ln)" stroke-width="9"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 50 50)"/>
  <text x="50" y="57" text-anchor="middle" font-size="22" font-weight="800" fill="var(--tx)">${dt}/${quota}</text></svg>
  <div style="font-size:22px;font-weight:800;margin:4px 0">${ch}章 ${Math.min(done(ch)+1,S.laps)}周目</div>
  <p class="mu" style="margin:0 0 14px">${msg}</p>
  <button class="go" onclick="start()">▶ ${left>0?'スタート':'もう1周する'}</button></div>
  <div class="c"><h2>${esc(S.book||'単語帳')} ／ 全体 ${pct}%（${dn}/${total}周）${S.dl?'・残り'+days+'日':''}</h2><div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="c"><h2>章ごとの進み（タップで章を選ぶ）</h2><div class="grid">${cells}</div></div>
  <div class="c"><h2>1語あたりの秒数（下がるほど加速）</h2>${last.length?`<div class="chart">${last.map(l=>`<div style="height:${Math.max(5,l.s/mx*100)}%"></div>`).join('')}</div><p class="mu" style="margin:6px 0 0">最新 ${last[last.length-1].s.toFixed(1)}秒／最速 ${best.toFixed(1)}秒</p>`:'<p class="mu" style="margin:0">最初の1周を記録しよう</p>'}</div>
  ${weak.length?`<div class="c"><h2>重点復習（直近の「正」が多い章）</h2>${weak.map(e=>`<div>${e[0]}章：正 ${e[1]}語</div>`).join('')}</div>`:''}
  <div class="row"><button class="g" onclick="edit=true;render()">設定</button><button class="g" onclick="undo()">直前を取消</button><button class="g" onclick="exportCsv()">CSV保存</button><a class="g" style="text-decoration:none" href="${xh}" target="_blank" rel="noopener">𝕏でシェア</a></div>
  <p class="mu" id="sy">${sync}</p>`;
}
render();boot();
</script></body></html>
